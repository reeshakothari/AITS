# AITS admin panel (Decap CMS). Edits are saved as commits to the site's Git repo,
# and Netlify rebuilds the site automatically after each save.
backend:
  name: github
  repo: reeshakothari/AITS
  branch: main
local_backend: true
site_url: https://aits.services
display_url: https://aits.services
logo_url: /images/logo.png
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
- name: settings
  label: Contact details & site settings
  files:
  - name: settings
    label: Contact details & site settings
    file: src/content/settings.json
    fields:
    - label: Company name
      name: companyName
      widget: string
    - label: Brand line (footer)
      name: brandLine
      widget: string
    - label: Email
      name: email
      widget: string
      required: false
    - label: Phone
      name: phone
      widget: string
      required: false
      hint: Include +91
    - label: WhatsApp number
      name: whatsapp
      widget: string
      required: false
    - label: Address
      name: address
      widget: text
      required: false
    - label: Business hours
      name: hours
      widget: string
      required: false
    - label: Google Maps link
      name: mapUrl
      widget: string
      required: false
    - label: Show preview banner
      name: previewBanner
      widget: boolean
      hint: Turn off at launch.
    - label: Preview banner text
      name: previewBannerText
      widget: string
- name: pages
  label: Pages
  files:
  - name: home
    label: Home
    file: src/content/home.json
    fields:
    - label: Search listing (SEO)
      name: seo
      widget: object
      collapsed: true
      fields:
      - label: Page title
        name: title
        widget: string
        hint: Shown in Google results and the browser tab. Aim for under 60 characters.
      - label: Description
        name: description
        widget: text
        hint: Shown under the title in Google results. Aim for 120 to 160 characters.
    - label: Hero
      name: hero
      widget: object
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Headline
        name: title
        widget: string
      - label: Intro
        name: lead
        widget: text
      - label: Motto
        name: motto
        widget: string
      - label: Tags
        name: tags
        widget: list
      - label: Image
        name: image
        widget: image
      - label: Image description (alt text)
        name: imageAlt
        widget: string
    - label: About AITS
      name: about
      widget: object
      fields:
      - label: Heading
        name: title
        widget: string
      - label: Text
        name: body
        widget: text
      - label: Keywords
        name: keywords
        widget: list
    - label: The problem
      name: problem
      widget: object
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Heading
        name: title
        widget: string
      - label: Items
        name: items
        widget: list
        fields:
        - label: Title
          name: title
          widget: string
        - label: Text
          name: text
          widget: text
    - label: Manual vs AITS comparison
      name: compare
      widget: object
      fields:
      - label: Manual path label
        name: manualLabel
        widget: string
      - label: Manual path steps
        name: manualSteps
        widget: list
      - label: AITS path label
        name: aitsLabel
        widget: string
      - label: AITS path steps
        name: aitsSteps
        widget: list
    - label: Topic cards
      name: topics
      widget: object
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Heading
        name: title
        widget: string
      - label: Cards
        name: cards
        widget: list
        fields:
        - label: Title
          name: title
          widget: string
        - label: Text
          name: text
          widget: text
        - label: Link
          name: link
          widget: string
        - label: Link text
          name: linkText
          widget: string
    - label: Closing call to action
      name: cta
      widget: object
      fields:
      - label: Heading
        name: title
        widget: string
      - label: Text
        name: text
        widget: text
      - label: Button text
        name: buttonText
        widget: string
